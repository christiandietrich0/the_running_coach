name = "the-running-coach"
main = "src/worker/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "running-coach-db"
# Placeholder id, valid for local dev only. Before the first remote deploy
# (Phase 9), run `wrangler d1 create running-coach-db` and replace this
# with the real database_id it prints.
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
# 02:00 UTC = 04:00 Europe/Berlin (CEST/CET aware pick per kickoff brief)
crons = ["0 2 * * *"]
