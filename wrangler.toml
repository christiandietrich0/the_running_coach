name = "the-running-coach"
main = "src/worker/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "running-coach-db"
database_id = "48fcf0f3-cfad-45b1-bac9-ca38391942db"

# A UUID unique per deployed Worker version, so GET /api/state can tell a
# deploy landed new plan logic since the plan was last regenerated and
# re-run suggestPlan() for non-edited future weeks automatically (v1.1
# review round 10 follow-up item 2).
[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
# 02:00 UTC = 04:00 Europe/Berlin (CEST/CET aware pick per kickoff brief)
crons = ["0 2 * * *"]
